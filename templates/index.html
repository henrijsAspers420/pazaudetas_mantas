{% extends 'base.html' %}

{% block content %}
<style>
    .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 28px;
    }
    .page-label {
        font-size: 11px;
        font-weight: 600;
        color: #44475e;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }
    .page-title { font-size: 24px; font-weight: 600; color: #f1f2f6; letter-spacing: -0.3px; }

    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: #555870; pointer-events: none; }
    .search-input {
        background: #1c1f2e;
        border: 1px solid #2a2d42;
        color: #c8cad4;
        border-radius: 10px;
        padding: 9px 14px 9px 34px;
        font-size: 13px;
        width: 260px;
        font-family: 'DM Sans', sans-serif;
        outline: none;
        transition: border-color 0.15s;
    }
    .search-input::placeholder { color: #555870; }
    .search-input:focus { border-color: #4f46e5; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px;
    }
    .card {
        background: #161820;
        border: 1px solid #23263a;
        border-radius: 14px;
        overflow: hidden;
        transition: transform 0.2s, border-color 0.2s;
        cursor: pointer;
    }
    .card:hover { transform: translateY(-3px); border-color: #383b56; }
    .card-img { height: 150px; background: #1c1f2e; overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 12px 14px 14px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
    .card-title { font-size: 14px; font-weight: 600; color: #e2e4ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { background: #312e81; color: #a5b4fc; font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .card-desc { font-size: 12px; color: #6b6f88; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-date { font-size: 11px; color: #44475e; margin-top: 10px; font-family: 'DM Mono', monospace; }
</style>

<div class="page-header">
    <div>
        <div class="page-label">Ogres Valsts ģimnāzija</div>
        <h1 class="page-title">Nozaudēts un Atrasts</h1>
    </div>
    <div class="search-wrap">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input class="search-input" type="text" placeholder="Meklēt mantu...">
    </div>
</div>

<div class="grid">
    <article class="card">
        <div class="card-img">
            <img src="static/img/Item_001.webp" alt="Melnas atslēgas">
        </div>
        <div class="card-body">
            <div class="card-top">
                <span class="card-title">Melnas atslēgas</span>
                <span class="badge">Pie Dežuranta</span>
            </div>
            <p class="card-desc">Atrastas pie sporta zāles garderobes. Atslēgu saišķis ar sarkanu piekariņu.</p>
            <div class="card-date">šodien</div>
        </div>
    </article>
</div>
{% endblock %}
