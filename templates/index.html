{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-label">Ogres Valsts ģimnāzija</div>
        <h1 class="page-title">Nozaudēts un Atrasts</h1>
    </div>
    <div class="search-wrap">
        <form action="/" method="GET">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input name="q" class="search-input" type="text" placeholder="Meklēt mantu..." value="{{ request.args.get('q', '') }}">
        </form>
    </div>
</div>

<div class="grid">
    {% for item in items %}
    <article class="card">
        <div class="card-img">
            <img src="{{ url_for('static', filename='img/' + item['bilde_url']) }}" alt="{{ item['nosaukums'] }}">
        </div>
        <div class="card-body">
            <div class="card-top">
                <span class="card-title">{{ item['nosaukums'] }}</span>
                <span class="badge">{{ item['statuss'] }}</span>
            </div>
            <p class="card-desc">{{ item['apraksts'] }}</p>
            <div class="card-date">{{ item['registracijas_laiks'][:10] }}</div>
        </div>
    </article>
    {% endfor %}
</div>
<div id="item-modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modal-img" src="" alt="">
        <div class="card-body">
            <div class="card-top">
                <h2 id="modal-title" class="card-title" style="font-size: 18px;"></h2>
                <span id="modal-badge" class="badge"></span>
            </div>
            <p id="modal-desc" style="color: #9496aa; font-size: 14px; margin-bottom: 15px;"></p>
            <div id="modal-date" class="card-date"></div>
        </div>
    </div>
</div>
<div id="item-modal" class="modal">
    <div class="modal-content">
        {% if session.get('is_admin') %}
        <form id="admin-delete-form" action="" method="POST" style="padding: 0 15px 15px;">
            <button type="submit" class="btn-primary" style="background: #ef4444; width: 100%;">
                Dzēst ierakstu (Admin)
            </button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
