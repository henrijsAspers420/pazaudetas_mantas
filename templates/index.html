{% extends 'base.html' %}

{% block content %}
<div class="space-y-8">
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
        <h1 class="text-3xl font-bold">Nozaudēts un Atrasts</h1>
        <div class="w-full sm:w-96 relative">
            <input type="text" placeholder="Meklēt mantu (piem., atslēgas, jaka)..." 
                   class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all shadow-sm">
            <svg class="w-5 h-5 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <article class="bg-surface rounded-2xl border border-slate-100 overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300 card-hover">
            <div class="h-48 bg-slate-200 w-full overflow-hidden">
                <img src="https://via.placeholder.com/400x300" alt="Melnas atslēgas" class="w-full h-full object-cover">
            </div>
            <div class="p-4 space-y-2">
                <div class="flex justify-between items-start">
                    <h2 class="font-semibold text-lg line-clamp-1">Melnas atslēgas</h2>
                    <span class="bg-primary/10 text-primary text-xs px-2 py-1 rounded-full font-medium">Atrasts</span>
                </div>
                <p class="text-sm text-textMuted line-clamp-2">Atrastas pie sporta zāles garderobes. Atslēgu saišķis ar sarkanu piekariņu.</p>
                <div class="pt-4 flex justify-between items-center">
                    <span class="text-xs text-slate-400">Pievienots: Šodien</span>
                    <button class="text-sm font-semibold text-primary hover:text-primaryHover">Skatīt vairāk &rarr;</button>
                </div>
            </div>
        </article>
        </div>
</div>
{% endblock %}
