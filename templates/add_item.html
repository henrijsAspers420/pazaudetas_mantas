{% extends 'base.html' %}
{% block content %}
<div class="form-wrap">
    <h1 class="form-title">Pievienot atrastu mantu</h1>

    <form action="/add" method="POST" enctype="multipart/form-data">
        <div class="field">
            <label>Foto (obligāts)</label>
            <div class="drop-zone" id="drop-zone">
                <input type="file" id="file-input" name="photo" class="hidden" accept="image/*" required style="display:none">
                <div id="preview-container" style="display:none">
                    <img id="image-preview" src="" alt="Priekšskatījums">
                </div>
                <div id="upload-placeholder">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    <span>Klikšķini, lai augšupielādētu bildi</span>
                </div>
            </div>
        </div>

        <div class="field">
            <label for="title">Īss nosaukums</label>
            <input type="text" id="title" name="title" required placeholder="Piem., Zila ūdens pudele">
        </div>

        <div class="field">
            <label for="description">Apraksts</label>
            <textarea id="description" name="description" rows="4" required placeholder="Kur tika atrasts? Īpašas pazīmes..."></textarea>
        </div>

        <button type="submit" class="btn-primary submit-btn">Pievienot sistēmā</button>
    </form>
</div>
{% endblock %}
