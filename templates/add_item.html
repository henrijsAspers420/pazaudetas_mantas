{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-surface p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
    <h1 class="text-2xl font-bold mb-6">Pievienot atrastu vai pazaudētu mantu</h1>
    
    <form action="/add" method="POST" enctype="multipart/form-data" class="space-y-6">
        
        <div>
            <label class="block text-sm font-medium mb-2">Pievienot foto (obligāts)</label>
            <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:bg-slate-50 transition-colors cursor-pointer group">
                <input type="file" id="file-input" name="photo" class="hidden" accept="image/*" required>
                <div id="preview-container" class="hidden">
                    <img id="image-preview" src="" alt="Priekšskatījums" class="max-h-48 mx-auto rounded-lg shadow-sm">
                </div>
                <div id="upload-placeholder" class="text-slate-500 group-hover:text-primary transition-colors">
                    <svg class="mx-auto h-12 w-12 mb-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span class="font-medium text-sm">Klikšķini, lai augšupielādētu bildi</span>
                </div>
            </div>
        </div>

        <div>
            <label for="title" class="block text-sm font-medium mb-2">Īss nosaukums</label>
            <input type="text" id="title" name="title" required placeholder="Piem., Zila ūdens pudele" 
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
        </div>

        <div>
            <label for="description" class="block text-sm font-medium mb-2">Detalizēts apraksts</label>
            <textarea id="description" name="description" rows="4" required placeholder="Kur tika atrasts? Īpašas pazīmes..." 
                      class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all resize-none"></textarea>
        </div>

        <button type="submit" class="btn-primary w-full py-3 rounded-xl font-semibold text-white transition-all transform active:scale-95 shadow-md hover:shadow-lg">
            Pievienot sistēmā
        </button>
    </form>
</div>
{% endblock %}
