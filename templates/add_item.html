{% extends 'base.html' %}

{% block content %}
<style>
    .form-wrap {
        max-width: 600px;
        margin: 0 auto;
        background: #161820;
        border: 1px solid #23263a;
        border-radius: 16px;
        padding: 32px;
    }
    .form-title { font-size: 20px; font-weight: 600; color: #f1f2f6; margin-bottom: 28px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #9496aa; margin-bottom: 8px; }
    input[type="text"], textarea {
        width: 100%;
        background: #1c1f2e;
        border: 1px solid #2a2d42;
        border-radius: 10px;
        color: #e2e4ea;
        font-size: 14px;
        font-family: 'DM Sans', sans-serif;
        padding: 10px 14px;
        outline: none;
        transition: border-color 0.15s;
    }
    input[type="text"]:focus, textarea:focus { border-color: #4f46e5; }
    input[type="text"]::placeholder, textarea::placeholder { color: #44475e; }
    textarea { resize: none; }

    .drop-zone {
        border: 2px dashed #2a2d42;
        border-radius: 12px;
        padding: 36px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone:hover { border-color: #4f46e5; background: #1c1f2e; }
    .drop-zone svg { color: #44475e; width: 40px; height: 40px; margin: 0 auto 12px; display: block; }
    .drop-zone span { font-size: 13px; color: #6b6f88; }

    .submit-btn {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        margin-top: 8px;
        transition: background 0.15s;
    }
    #preview-container img { max-height: 180px; border-radius: 8px; margin: 0 auto; display: block; }
</style>

<div class="form-wrap">
    <h1 class="form-title">Pievienot atrastu mantu</h1>

    <form action="/add" method="POST" enctype="multipart/form-data">
        <div class="field">
            <label>Foto (obligāts)</label>
            <div class="drop-zone" id="drop-zone">
                <input type="file" id="file-input" name="photo" class="hidden" accept="image/*" required style="display:none">
                <div id="preview-container" style="display:none">
                    <img id="image-preview" src="" alt="Priekšskatījums">
                </div>
                <div id="upload-placeholder">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    <span>Klikšķini, lai augšupielādētu bildi</span>
                </div>
            </div>
        </div>

        <div class="field">
            <label for="title">Īss nosaukums</label>
            <input type="text" id="title" name="title" required placeholder="Piem., Zila ūdens pudele">
        </div>

        <div class="field">
            <label for="description">Apraksts</label>
            <textarea id="description" name="description" rows="4" required placeholder="Kur tika atrasts? Īpašas pazīmes..."></textarea>
        </div>

        <button type="submit" class="btn-primary submit-btn">Pievienot sistēmā</button>
    </form>
</div>
{% endblock %}
